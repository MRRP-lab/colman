# The overhead camera's detector. Its tags are named ovh_tag_N so they do not collide
# with the wrist camera's tag_N; the wrist camera is the accurate one, and an overhead
# pose is only used to decide where to look from.
apriltag_overhead:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.0392  # the black square of the cube tags measures 39.2 mm
    max_hamming: 0
    detector:
      threads: 8
      # Quads are found on an image shrunk by this factor, and the corners are then
      # refined on the full-size image. A tag is about 62 px wide at 4K, so about 21 px at
      # 3. Measured: on a 4K still the detector did 8 detections per second at 1 and about
      # 40 at 3; live on the camera (4K, 30 fps) it keeps up at 30 per second. Corners
      # moved at most 0.08 px (0.05 mm at the table) against decimate 1, but a tag's
      # height moved by up to 1.5 mm. Above 6 the corners drift (1.9 mm at 8) and at 10
      # tags are lost. Keep refine on: with it off, corners moved 0.6 to 0.8 px.
      decimate: 3.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: "pnp"
    tag:
      ids:    [1, 2, 3, 4, 5, 6, 7, 8]
      frames: ["ovh_tag_1", "ovh_tag_2", "ovh_tag_3", "ovh_tag_4", "ovh_tag_5", "ovh_tag_6", "ovh_tag_7", "ovh_tag_8"]
      sizes:  [0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392]
