# The overhead camera's detector. Its tags are named ovh_tag_N so they do not collide
# with the wrist camera's tag_N; the wrist camera is the accurate one, and an overhead
# pose is only used to decide where to look from.
apriltag_overhead:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.0392  # the black square of the cube tags measures 39.2 mm
    max_hamming: 0
    detector:
      threads: 8
      # Quads are found on an image shrunk by this factor, then the corners are refined on
      # the full-size image. A tag is about 62 px wide at 4K, so it is about 16 px wide at
      # 4. Measured on one 4K still with 3 tags: decimate 1 gives 8 detections per second
      # and decimate 4 gives about 68, with corners moving at most 0.11 px (0.07 mm at the
      # table) and a tag's height moving up to 2.6 mm. Above 6 the corners drift (1.9 mm at
      # 8) and at 10 tags are lost. Keep refine on: with it off, corners move 0.6 to 0.8 px.
      decimate: 4.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: "pnp"
    tag:
      ids:    [1, 2, 3, 4, 5, 6, 7, 8]
      frames: ["ovh_tag_1", "ovh_tag_2", "ovh_tag_3", "ovh_tag_4", "ovh_tag_5", "ovh_tag_6", "ovh_tag_7", "ovh_tag_8"]
      sizes:  [0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392, 0.0392]
