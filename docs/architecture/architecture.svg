<text x="40" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748b" text-anchor="start">You speak, the AI model turns that into arm commands (goto, pickup, ...) and talks back. The camera finds AprilTags so the arm knows where things are.</text>
