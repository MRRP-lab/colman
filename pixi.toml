[workspace]
authors = ["Neil Macneale V <neil.macneale.v@gmail.com>", "Pierce Coyle <dev@piercecoyle.com>"]
channels = ["robostack-jazzy", "https://prefix.dev/pierce-colman", "conda-forge"]
name = "colman"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
linux = "6.8.0"
libc = { family = "glibc", version = "2.39" }

[activation]
scripts = ["install/setup.sh"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tasks]
sim = "ros2 launch colman_bringup colman.launch.py sim:=true"
sim-depth = "ros2 launch colman_bringup colman.launch.py sim:=true depth:=true"
sim-yolo = "ros2 launch colman_bringup colman.launch.py sim:=true yolo:=true"
sim-calibration = "ros2 launch colman_bringup colman.launch.py sim:=true depth:=true world:=$PIXI_PROJECT_ROOT/src/colman_gazebo/colman_gazebo/worlds/calibration_world.sdf"
mock = "ros2 launch ur_robot_driver ur_control.launch.py ur_type:=ur3e robot_ip:=0.0.0.0 use_mock_hardware:=true launch_dashboard_client:=false description_launchfile:=$(ros2 pkg prefix colman_bringup)/share/colman_bringup/launch/rsp.launch.py"
driver = "ros2 run colman_bringup driver_supervisor --ros-args -p robot_ip:=192.168.56.101"

detect = "ros2 run colman_perception camera_publisher & ros2 launch colman_bringup apriltag.launch.py"
motion = "ros2 launch colman_motion motion_server.launch.py gripper_type:=vacuum"
demo = "ros2 run colman_motion pick_and_place"
demo-turns = "ros2 launch colman_motion demo.launch.py demo:=demo_turns"
demo-choose = "ros2 launch colman_motion demo.launch.py demo:=demo_choose"
demo-circle = "ros2 launch colman_motion demo.launch.py demo:=demo_circle"
demo-obstacle = "ros2 launch colman_motion demo.launch.py demo:=demo_obstacle"
demo-camera = "ros2 launch colman_motion demo.launch.py demo:=demo_camera"
click-move = "ros2 launch colman_motion demo.launch.py demo:=click_move"
find-table = "ros2 run colman_perception table_finder"
view-depth = "ros2 run colman_perception depth_view"
calib-sweep = "ros2 launch colman_motion demo.launch.py demo:=calib_sweep"

speak = "ros2 run colman_audio_output kokoro_tts"

stop = "ros2 service call /stop std_srvs/srv/Trigger"
resume = "ros2 service call /resume std_srvs/srv/Trigger"
build = "colcon build --symlink-install --base-paths src"
node-list = "ros2 node list"
topic-list = "ros2 topic list"
gz-list = "gz topic -l"
image-view = "ros2 run rqt_image_view rqt_image_view"
graph = "rqt_graph"

fmt  = "ruff format src/"
lint = "ruff check --fix src/"
clean = "rm -rf build install log"

[activation.env]
# Tells gazebo to look in these directories for models.
GZ_SIM_RESOURCE_PATH = "$GZ_SIM_RESOURCE_PATH:$PIXI_PROJECT_ROOT/src/colman_gazebo/colman_gazebo/models:$PIXI_PROJECT_ROOT/src/oakd_gazebo/oakd_gazebo/models:$PIXI_PROJECT_ROOT/install/oakd_description/share:$PIXI_PROJECT_ROOT/install/gripper_description/share:$PIXI_PROJECT_ROOT/install/colman_description/share"

[dependencies]
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=70.8.0"
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-xacro = ">=2.0.11,<3"
ros-jazzy-ur-description = ">=3.0.1,<4"
ros-jazzy-robotiq-description = ">=0.0.1,<0.0.2"
ros-jazzy-gz-sim-vendor = ">=0.0.9,<0.0.10"
ros-jazzy-ros-gz = ">=1.0.16,<2"
ros-jazzy-ros2-control = ">=4.33.0,<5"
ros-jazzy-moveit = ">=2.12.3,<3"
make = ">=4.4.1,<5"
compilers = ">=1.11.0,<2"
ros-jazzy-gz-ros2-control = ">=1.2.14,<2"
ros-jazzy-ros2-controllers = ">=4.28.0,<5"
ros-jazzy-rqt-graph = ">=1.5.4,<2"
ros-jazzy-rqt-image-view = ">=1.3.0,<2"
ros-jazzy-image-pipeline = ">=5.0.11,<6"
ros-jazzy-pcl-ros = ">=2.6.2,<3"
ros-jazzy-apriltag = ">=3.4.3,<4"
ros-jazzy-apriltag-ros = ">=3.2.2,<4"
ros-jazzy-moveit-py = ">=2.12.3,<3"
git-lfs = ">=3.7.1,<4"
ros-jazzy-trac-ik-lib = "*"
ros-jazzy-trac-ik-kinematics-plugin = "*"
ruff = ">=0.15.4,<0.16"
ros-jazzy-ur-robot-driver = ">=3.7.0,<4"
mpv = ">=0.41.0,<0.42"
ffmpeg = ">=8.0.1,<9"
portaudio = "*"

[pypi-dependencies]
ultralytics = ">=8.4.11, <9"
depthai = ">=2.24"
kokoro = ">=0.9.4, <1"
soundfile = ">=0.12"
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
onnx-asr = { version = ">=0.7", extras = ["hub"] }
onnxruntime-gpu = ">=1.20"
silero-vad = ">=5"
sounddevice = "*"
huggingface_hub = "*"
