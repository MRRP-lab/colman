name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          args: "format --check"
          src: src/
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.4"
          src: src/

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The pixi env (ROS + torch/CUDA wheels) is ~15GB installed; the runner
      # only has ~14GB free, so reclaim space before installing.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          locked: true
          # Don't cache the multi-GB env; saving it can also exhaust disk.
          cache: false
      - run: pixi run build
      # ruff (lint job) is the style checker; the ament flake8/pep257 template
      # tests disagree with its formatting, so skip them here.
      - run: pixi run colcon test --event-handlers console_direct+ --pytest-args -k "not flake8 and not pep257 and not pick_place_sim"
      - run: pixi run colcon test-result --verbose
      # Motion-level integration test: the real motion server and MoveIt against mock UR
      # hardware and fake tags, in its own ROS domain on localhost. No Gazebo or display.
      # It has its own step so a failure uploads the process logs.
      - name: Integration test (mock hardware)
        timeout-minutes: 20
        run: pixi run test-integration
      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: build/integration_logs
          if-no-files-found: ignore
